[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vmctl"
version = "0.5.0"
description = "SSH client and local worker for Proxmox VM management"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.16,<1",
    "rich>=13.9,<16",
    "pydantic>=2.10,<3",
    "PyYAML>=6,<7",
    "passlib>=1.7.4,<2",
    "platformdirs>=4.3,<5",
    "textual>=8.2.8,<9",
]

[project.scripts]
vmctl = "vmctl.cli:app"
vmctl-worker = "vmctl.worker:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.11",
    "mypy>=1.15",
    "types-PyYAML>=6",
    "types-passlib>=1.7.7.20260211",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vmctl"]

[tool.hatch.build.targets.wheel.force-include]
"config" = "vmctl/_defaults"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
