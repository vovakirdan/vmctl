[implementations.alpine]
# Requires the existing Alpine community repository; vmctl does not edit repositories.
packages = ["python3", "py3-pip", "ca-certificates"]
commands = [["python3", "--version"], ["python3", "-m", "pip", "--version"]]
scripts = [{file = "uv-install.sh", args = ["{username}"]}]
[[implementations.alpine.files]]
