name = "python"
description = "Distribution Python, pip and virtual environments, plus upstream uv for the cloud user"
dependencies = ["base"]
default_version = "system"

[implementations.debian]
packages = ["python3", "python3-pip", "python3-venv", "ca-certificates"]
commands = [["python3", "--version"], ["python3", "-m", "pip", "--version"]]
scripts = [{file = "uv-install.sh", args = ["{username}"]}]
[[implementations.debian.files]]
path = "/etc/profile.d/vmctl-python.sh"
owner = "root:root"
permissions = "0644"
content = '''
# vmctl: tools for the configured cloud user; development bootstrap only.
if [ "$(id -un)" = "{username}" ]; then
    case ":$PATH:" in
        *":$HOME/.local/bin:"*) ;;
        *) export PATH="$HOME/.local/bin:$PATH" ;;
    esac
fi
'''

[implementations.rhel]
packages = ["python3", "python3-pip", "ca-certificates"]
commands = [["python3", "--version"], ["python3", "-m", "pip", "--version"]]
scripts = [{file = "uv-install.sh", args = ["{username}"]}]
[[implementations.rhel.files]]
path = "/etc/profile.d/vmctl-python.sh"
owner = "root:root"
permissions = "0644"
content = '''
